buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        // Поддерживаемый форк ForgeGradle 1.2: качает Minecraft с piston-meta (старый S3 умер)
        classpath "com.anatawa12.forge:ForgeGradle:1.2-1.1.1"
    }
}

plugins {
    id "java"
}

apply plugin: "forge"

version = "1.0.0"
group = "com.narezany.chaoschoice"
archivesBaseName = "ChaosChoice-1.7.10"

sourceCompatibility = JavaVersion.VERSION_1_7
targetCompatibility = JavaVersion.VERSION_1_7

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

jar {
    manifest {
        attributes "ModID": "chaoschoice"
        attributes "Implementation-Title": "Chaos Choice"
        attributes "Implementation-Version": project.version
    }
}
