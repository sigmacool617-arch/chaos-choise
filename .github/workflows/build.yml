name: Build mods (1.7.10)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fg12-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'fastbuild/build.gradle', 'drill/build.gradle') }}
          restore-keys: |
            fg12-${{ runner.os }}-

      - name: Gradle 7.4.2
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-7.4.2/bin" >> "$GITHUB_PATH"

      - name: Build Chaos Choice
        run: gradle build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Build FastBuild
        run: gradle -p fastbuild build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Build Drill
        run: gradle -p drill build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Build Backpack
        run: gradle -p backpack build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Build Titanium
        run: gradle -p titanium build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Upload Chaos Choice
        uses: actions/upload-artifact@v4
        with:
          name: ChaosChoice-1.7.10
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload FastBuild
        uses: actions/upload-artifact@v4
        with:
          name: FastBuild-1.7.10
          path: fastbuild/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Drill
        uses: actions/upload-artifact@v4
        with:
          name: Drill-1.7.10
          path: drill/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Backpack
        uses: actions/upload-artifact@v4
        with:
          name: Backpack-1.7.10
          path: backpack/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Titanium
        uses: actions/upload-artifact@v4
        with:
          name: Titanium-1.7.10
          path: titanium/build/libs/*.jar
          if-no-files-found: error
