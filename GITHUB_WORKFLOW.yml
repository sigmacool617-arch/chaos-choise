name: Build ChaosChoice (1.7.10)

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Gradle 2.14.1
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: gradle build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2G
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ChaosChoice-1.7.10
          path: build/libs/*.jar
          if-no-files-found: error
